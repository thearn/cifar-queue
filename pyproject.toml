[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cifarq"
version = "0.3.0"
description = "CIFAR-10 with a small CNN, trained and tuned through the solve queue (local GPU and Colab VMs)"
authors = [{ name = "Tristan Hearn" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["jax>=0.7", "flax>=0.12", "optax>=0.2.6", "numpy", "huggingface_hub>=0.25", "safetensors", "jinja2"]  # (jinja2: the hub mixin's model card)

# The GPU build of jaxlib: `pip install -e ".[cuda]"` on a CUDA machine (the CPU build is enough for the tests)

[project.optional-dependencies]
train = ["optuna>=4", "pyarrow", "pillow"]          # the data stages, the search
cuda = ["jax[cuda12]>=0.7"]                         # NVIDIA GPUs (local, Colab VMs)
ray = ["ray[tune]>=2.50"]                            # mode 2 driven by Ray Tune (on_vm_ray), PBT
app = ["gradio>=5", "pillow"]                        # app/app.py
test = ["pytest", "optuna>=4", "pyarrow", "pillow", "vulture==2.14", "ruff==0.14.0"]
queue = ["runq[gcs]"]                         # pipeline/ on the queue (runq: not public)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src first: a worktree's tests import its own code ahead of the editable install's (which names the main checkout)
pythonpath = ["src"]
testpaths = ["tests"]                               # (not results/publish/: a staged copy of the repository)
markers = ["gate: style and structure checks run when work lands on main (git land), not on branches", "queue: runs a job through runq's daemon (skipped unless it is set up)"]

addopts = "-m 'not gate'"
[tool.ruff]
line-length = 150               # the house style (runq's); 130 wraps lines for no behaviour
target-version = "py311"
extend-exclude = ["results", "data"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "SIM", "BLE"]
ignore = [
  "E731",             # a lambda assigned to a name: small local helpers
  "E741",             # single-letter names beside their definitions
  "SIM108", "SIM117", # ternaries and merged with-blocks forced where two lines read better
  "SIM105",           # try/except/pass written out rather than contextlib.suppress
  "SIM102",           # nested ifs kept where a comment sits between the conditions
  "SIM115",           # a file opened for a child process's output, held by the process, not a with-block
]

# The structure check of the global git hooks (lib/git-hooks, quality/structure.py), run by the pre-push hook on a
# push to main. Report mode: measures printed, nothing refused; switch to "gate" once the main features have settled.
[tool.structure]
package = "src/cifarq"
mode = "report"
exclude = ["airbench.py"]  # ported from K. Jordan's cifar10-airbench as it is

# The prose check of the global git hooks (lib/git-hooks, prose/check.py: Vale with the AIWriting and TristanHearn
# styles) on Markdown, comments and docstrings, run by the pre-push hook on a push to main: gate refuses an error in the lines a push adds mode.

# The landing gate (lib/git-hooks: git land, quality/gate.py): main moves only through git land once this table is here
[tool.quality]
absolute = ["function_size", "function_complexity", "module_size", "duplicate", "pass_through", "noqa"]
package = "src/cifarq"
python = "~/.venvs/cifarq-jax/bin/python"

[tool.prose]
mode = "gate"

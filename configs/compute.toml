# Where each pipeline stage runs. A stage's targets are {target = slots}: "direct" (in this process, no queue: CI),
# "local" (the RTX 4060, through the queue), "colab:NAME" (an executor below); slots are how many of the stage's jobs
# run at once on that target. Resource hints are the job's peak needs, for the queue's admission. Command-line
# --targets on a stage overrides its line here. One training at a time was best on every card measured (README).

session = "cifar"                         # RUNQ_SESSION: labels, runq news/brief/wait follow it

[executors]                               # registered when a stage names them (no VM until a job needs one)
cifar-l4a = { gpu = "L4", idle_minutes = 5 }
cifar-l4b = { gpu = "L4", idle_minutes = 5 }
cifar-g4 = { gpu = "G4", idle_minutes = 1 }
cifar-a100 = { gpu = "A100", idle_minutes = 1 }
# the front study's rented cards (runq clouds): RunPod through SkyPilot (on-demand, the cards it has in stock, R2:
# layers missing there are copied in from GCS by the VM) and a Compute Engine spot L4; each VM stops itself after 15
# idle minutes
front-rp = { provider = "sky", gpu = "RTX4090,RTXA5000,A40,L4", infra = "runpod", spot = false, store = "r2", idle_minutes = 3, vm_idle_min = 10 }
cifar-rp6000 = { provider = "sky", gpu = "RTXPRO6000", infra = "runpod", spot = false, store = "r2", idle_minutes = 3, vm_idle_min = 10 }   # the G4's card (RTX PRO 6000) on RunPod, when Colab has no G4 (2026-11-09)
cifar-vast6k = { provider = "vast", gpu = "RTXPRO6000S,RTXPRO6000WS", store = "r2", max_usd_h = 2.5, idle_minutes = 3, vm_idle_min = 10 }   # the G4's card on Vast, server or workstation edition (Colab and RunPod had none, 2026-11-09)
front-l4 = { provider = "gce", gpu = "L4", idle_minutes = 3, vm_idle_min = 10 }
front-vast = { provider = "vast", gpu = "RTX4090,RTX3090,RTXA5000,RTXA4000", store = "r2", idle_minutes = 3, vm_idle_min = 10 }
front-lam = { provider = "sky", gpu = "A10,RTX6000,A6000", infra = "lambda", spot = false, store = "r2", idle_minutes = 3, vm_idle_min = 10 }

[stages.clean]                            # decoding the two parquet files: here
targets = { direct = 1 }
gpu_mb = 0
host_mb = 4000
minutes = 5

[stages.train]                            # one training (16 epochs at the defaults: 37 s on an L4)
targets = { local = 1 }
gpu_mb = 3000
host_mb = 6000
minutes = 5

[stages.tune]                             # trials as jobs (tune.job_options sizes each one); mode 3 was the 4060 and both L4s:
targets = { local = 1 }
# targets = { local = 1, "colab:cifar-l4a" = 1, "colab:cifar-l4b" = 1 }
gpu_mb = 3000
host_mb = 6000
minutes = 5
worker = { preload = ["jax", "flax.nnx", "optax", "numpy", "cifarq.airbench", "cifarq.families", "cifarq.methods", "cifarq.augment"] }   # forks of a persistent worker on a VM: no interpreter start or imports a trial (10-20 s each, 2026-11-05); jax imported, no device touched before the fork

[stages.tune_on_vm]                       # mode 2: a whole search inside one job (pipeline/55_tune_on_vm.py)
targets = { "colab:cifar-l4a" = 1 }
gpu_mb = 22000
host_mb = 6000

[stages.champion]                         # the best parameters over several seeds
targets = { local = 1 }
# targets = { local = 1, "colab:cifar-l4a" = 1, "colab:cifar-l4b" = 1 }
gpu_mb = 3000
host_mb = 6000
minutes = 10
worker = { preload = ["jax", "flax.nnx", "optax", "numpy", "cifarq.train", "cifarq.data.dataset:warm"] }   # forks of a persistent worker on a VM; jax imported, no device touched before the fork

[stages.pbt]                              # pipeline/tools/pbt_g4.py
targets = { "colab:cifar-g4" = 1 }
gpu_mb = 20000
host_mb = 16000
minutes = 30

[stages.front]                            # the accuracy/MACs front (pipeline/57_front.py): two-seed trials, 100 epochs
targets = { "colab:cifar-g4" = 1, "colab:front-rp" = 1, "colab:front-l4" = 1 }
gpu_mb = 20000
host_mb = 12000
minutes = 45
worker = { preload = ["jax", "flax.nnx", "optax", "numpy", "cifarq.airbench", "cifarq.families", "cifarq.methods", "cifarq.augment"] }   # forks of a persistent worker on a VM: no interpreter start or imports a trial (10-20 s each, 2026-11-05); jax imported, no device touched before the fork
